name: Build images manifest

on:
  push:
    branches: [ main, master ]
    paths:
      - "gallery/pictures/**"
      - "gallery/videos/**"
      - "images/**"
      - "scripts/build-manifest.mjs"
      - "scripts/optimize-images.mjs"
      - "scripts/optimize-videos.mjs"
      - ".github/workflows/build-manifest.yml"
      - "package.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Pull LFS objects (safety)
        run: git lfs pull

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Optimize images for web
        run: npm run optimize:images

      - name: Generate data/images.json
        run: node scripts/build-manifest.mjs

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/images.json gallery/pictures_web/ gallery/videos_web/ images/tribute_slideshow_web/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(manifest): update images.json [skip ci]"
            git push
          fi

