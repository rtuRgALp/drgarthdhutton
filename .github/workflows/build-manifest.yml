name: Build images manifest

on:
  push:
    branches: [ main, master ]
    paths:
      - "images/**"
      - "scripts/build-manifest.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Generate data/images.json
        run: node scripts/build-manifest.mjs

      - name: Commit manifest
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/images.json
            git commit -m "chore(manifest): update images.json [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

